name: Deploy production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy
        default: master
        required: true
      dry_run:
        description: Run remote checks without deploying
        default: 'true'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
      deploy_mode:
        description: Launch check mode to use on the VPS
        default: public
        required: true
        type: choice
        options:
          - public
          - testing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Remote preflight or deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DD_PROD_HOST }}
          username: ${{ secrets.DD_PROD_USER }}
          key: ${{ secrets.DD_PROD_SSH_KEY }}
          port: ${{ secrets.DD_PROD_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DD_PROD_APP_DIR }}"
            git fetch origin "${{ inputs.branch }}"
            git checkout "${{ inputs.branch }}"
            git pull --ff-only origin "${{ inputs.branch }}"
            case "${{ inputs.deploy_mode }}" in
              public)
                LAUNCH_CHECK_ARGS="--public"
                ;;
              testing)
                LAUNCH_CHECK_ARGS="--testing"
                ;;
              *)
                echo "Unknown deploy_mode: ${{ inputs.deploy_mode }}" >&2
                exit 1
                ;;
            esac
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
              npm ci
              npm run build
              php artisan migrate:status
              php artisan dd:launch-check "$LAUNCH_CHECK_ARGS"
            else
              DD_DEPLOY_MODE="${{ inputs.deploy_mode }}" APP_DIR="${{ secrets.DD_PROD_APP_DIR }}" BRANCH="${{ inputs.branch }}" bash scripts/deploy-production.sh
            fi
