server {
    listen 80;
    server_name dream-digital.info www.dream-digital.info;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dream-digital.info www.dream-digital.info;
    root /var/www/dream-digital-website/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/dream-digital.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dream-digital.info/privkey.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /readyz {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
